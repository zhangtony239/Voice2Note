# Voice2Note (v2n) 配置文件
# 本文件是 v2n 所有配置的唯一默认值源：默认值与解释只在这里维护，
# 代码中不为必填字段提供备用默认值——删除或留空必填字段后，v2n 会在
# 加载配置时报错（错误信息会列出全部缺失字段）。

# 音频文件所在目录（相对或绝对路径均可），v2n 在该目录下发现待处理录音
VOICE_PATH: .

# 音频文件名的正则表达式（re.search 语义），匹配者才纳入待处理列表
# 示例：匹配常见音频扩展名
VOICE_FILE_KEYWORD: \.(mp3|wav|m4a|flac)$

# PyTorch 后端，可选值：xpu | cuda
TORCH_BACKEND: xpu

# 是否禁用 mmap 加载模型权重。
# 默认注释掉，由 TORCH_BACKEND 推导：
#   xpu  -> 默认开启（true）：UMA 共享内存充足，禁用 mmap 可避免跨设备映射问题
#   cuda -> 默认关闭（false）
# 取消注释可显式覆盖推导值。
# DISABLE_MMAP: true

# ---- LLM 阶段（OpenAI 兼容 API）----

# API 基础地址，例如: https://api.example.com/v1
LLM_BASE_URL: ""

# API 密钥（必填）
LLM_API_KEY: ""

# 模型名称（必填），例如: gpt-4o-mini
LLM_MODEL: ""

# 系统提示词（必填）：驱动 LLM 将 STT 原稿整理为笔记，
# 并以 tool calling 方式把笔记写入文件
SYSTEM_PROMPT: ""

# ---- 笔记输出 ----

# 笔记输出目录（目录不存在时会自动创建）
NOTE_PATH: outputs/

# 笔记文件名最大长度：取笔记正文首行作为文件名，超长截断到该字符数
MAX_TITLE_LENGTH: 20
